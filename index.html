
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05050c">
<title>NEXVORA UNBAN | Welcome</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --blue: #168cff;
  --purple: #a13cff;
  --white: #f6f5ff;
  --muted: #9999b5;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  min-height: 100%;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
  background: #05050c;
  color: var(--white);
  font-family: 'Inter', sans-serif;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 18% 28%, #0757bd35, transparent 42%),
    radial-gradient(ellipse at 82% 70%, #7613a735, transparent 45%),
    radial-gradient(ellipse at 50% 50%, #10102a 0%, #05050c 75%);
}

#particles {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}

.particle {
  position: absolute;
  width: 2px;
  height: 2px;
  border-radius: 50%;
  background: #9bbcff;
  box-shadow: 0 0 9px #438cff;
  opacity: 0;
  animation: particleFloat linear infinite;
}

.particle.purple {
  background: #d0a1ff;
  box-shadow: 0 0 9px #a13cff;
}

@keyframes particleFloat {
  0% {
    transform: translateY(20px);
    opacity: 0;
  }
  15% { opacity: .8; }
  85% { opacity: .5; }
  100% {
    transform: translateY(-110vh);
    opacity: 0;
  }
}

.ambient {
  position: fixed;
  width: 380px;
  height: 380px;
  border-radius: 50%;
  filter: blur(110px);
  opacity: .17;
  pointer-events: none;
  z-index: 0;
}

.ambient-blue {
  background: #087aff;
  top: -220px;
  left: -140px;
  animation: ambientMove 9s ease-in-out infinite alternate;
}

.ambient-purple {
  background: #8c25ff;
  right: -180px;
  bottom: -220px;
  animation: ambientMove 11s ease-in-out infinite alternate-reverse;
}

@keyframes ambientMove {
  to { transform: translate(70px, 55px) scale(1.2); }
}

.page {
  position: relative;
  z-index: 2;
  width: 100%;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 25px 28px 22px;
}

/* BRAND */

.header {
  width: 100%;
  max-width: 1150px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 12px;
  animation: brandEnter 1.1s .2s cubic-bezier(.16,1,.3,1) both;
}

.logo-wrap {
  width: 57px;
  height: 57px;
  border-radius: 50%;
  overflow: hidden;
  flex-shrink: 0;
  position: relative;
  border: 1px solid #6e9cff99;
  box-shadow:
    0 0 12px #168cff55,
    0 0 25px #8c37ff30;
  animation: logoGlow 3s ease-in-out infinite alternate;
}

.logo {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
  border-radius: 50%;
}

.brand-name {
  font-family: 'Orbitron', sans-serif;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 2px;
  color: #fff;
}

.brand-sub {
  margin-top: 5px;
  font-size: 9px;
  letter-spacing: 3px;
  color: #9c9cbd;
}

@keyframes brandEnter {
  from {
    opacity: 0;
    transform: translateY(-20px);
    filter: blur(7px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
    filter: blur(0);
  }
}

@keyframes logoGlow {
  from {
    box-shadow: 0 0 10px #168cff55, 0 0 18px #8c37ff25;
  }
  to {
    box-shadow: 0 0 18px #168cffaa, 0 0 32px #8c37ff70;
  }
}

/* WELCOME */

.main {
  flex: 1;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 35px 0 55px;
}

.content {
  width: 100%;
  max-width: 720px;
}

.overline {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: #a7baff;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 4px;
  animation: revealUp .9s .7s both;
}

.overline::before,
.overline::after {
  content: "";
  width: 27px;
  height: 1px;
  background: linear-gradient(90deg, transparent, #6e9cff);
}

.overline::after {
  transform: rotate(180deg);
}

.heading {
  margin-top: 27px;
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(32px, 7.5vw, 66px);
  font-weight: 800;
  line-height: 1.2;
  letter-spacing: -2px;
  animation: titleReveal 1.2s .9s cubic-bezier(.16,1,.3,1) both;
}

.heading .line-two {
  display: block;
  margin-top: 5px;
  background: linear-gradient(100deg, #66b7ff, #8d78ff 48%, #d080ff);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 18px #755cff55);
}

.description {
  max-width: 490px;
  margin: 23px auto 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 2;
  animation: revealUp 1s 1.5s both;
}

.divider {
  width: 70px;
  height: 2px;
  margin: 30px auto;
  background: linear-gradient(90deg, #168cff, #a13cff);
  border-radius: 10px;
  box-shadow: 0 0 14px #8b66ff;
  transform: scaleX(0);
  animation: lineReveal .8s 1.9s forwards;
}

/* BUTTON */

.enter-wrap {
  animation: revealUp 1s 2.1s both;
}

.enter-button {
  width: 210px;
  height: 57px;
  position: relative;
  border: 1px solid #b3baff99;
  border-radius: 10px;
  color: white;
  font-family: 'Orbitron', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 3px;
  cursor: pointer;
  overflow: hidden;
  background: linear-gradient(105deg, #126be8, #7542d8);
  box-shadow:
    0 0 20px #246fff55,
    0 0 45px #7d35ff25;
  transition: transform .3s, box-shadow .3s;
}

.enter-button::before {
  content: "";
  position: absolute;
  top: 0;
  left: -100%;
  width: 65%;
  height: 100%;
  transform: skewX(-25deg);
  background: linear-gradient(90deg, transparent, #ffffff55, transparent);
  animation: buttonShine 3s 3s infinite;
}

.enter-button:hover {
  transform: translateY(-4px);
  box-shadow:
    0 0 25px #246fff99,
    0 0 60px #7d35ff55;
}

.enter-button:active {
  transform: scale(.97);
}

.enter-button:disabled {
  opacity: .7;
  cursor: wait;
}

.button-caption {
  margin-top: 14px;
  color: #72728f;
  font-size: 9px;
  letter-spacing: 2px;
}

@keyframes buttonShine {
  0%, 45% { left: -100%; }
  75%, 100% { left: 150%; }
}

/* FOOTER */

.footer {
  text-align: center;
  color: #686881;
  font-size: 9px;
  letter-spacing: 2px;
  animation: revealUp 1s 2.3s both;
}

/* ENTRANCE ANIMATIONS */

@keyframes revealUp {
  from {
    opacity: 0;
    transform: translateY(22px);
    filter: blur(5px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
    filter: blur(0);
  }
}

@keyframes titleReveal {
  from {
    opacity: 0;
    transform: translateY(35px) scale(.96);
    filter: blur(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0);
  }
}

@keyframes lineReveal {
  to { transform: scaleX(1); }
}

/* EXIT TRANSITION */

body.leaving .page {
  animation: pageExit .55s ease forwards;
  pointer-events: none;
}

@keyframes pageExit {
  to {
    opacity: 0;
    transform: scale(1.025);
    filter: blur(10px);
  }
}

@media(max-width: 600px) {
  .page {
    padding: 20px 21px;
  }

  .logo-wrap {
    width: 51px;
    height: 51px;
  }

  .brand-name {
    font-size: 12px;
  }

  .heading {
    letter-spacing: -1.5px;
  }

  .description {
    font-size: 12px;
    padding: 0 7px;
  }

  .main {
    padding-bottom: 35px;
  }
}

@media(prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
  }
}
</style>

<body>

<div id="particles"></div>
<div class="ambient ambient-blue"></div>
<div class="ambient ambient-purple"></div>

<div class="page">

  <header class="header">
    <div class="logo-wrap">
      <img
        src="assets/nexvora-logo.png"
        class="logo"
        alt="NEXVORA UNBAN"
      >
    </div>

    <div>
      <div class="brand-name">NEXVORA UNBAN</div>
      <div class="brand-sub">NEXVORA UNIVERSE</div>
    </div>
  </header>

  <main class="main">
    <section class="content">

      <div class="overline">
        THE NEXT LEVEL EXPERIENCE
      </div>

      <h1 class="heading">
        WELCOME TO
        <span class="line-two">NEXVORA UNBAN</span>
      </h1>

      <p class="description">
        Enter the NEXVORA Universe.
        Your journey begins here — a dedicated experience
        built around precision, access and excellence.
      </p>

      <div class="divider"></div>

      <div class="enter-wrap">
        <button class="enter-button" id="enterButton" type="button">
          ENTER <span aria-hidden="true">→</span>
        </button>

        <div class="button-caption">
          ENTER THE NEXVORA UNIVERSE
        </div>
      </div>

    </section>
  </main>

  <footer class="footer">
    © 2026 NEXVORA UNIVERSE · ALL RIGHTS RESERVED
  </footer>

</div>


<script>
/* PARTICLES */
const particleArea = document.getElementById("particles");

for (let i = 0; i < 38; i++) {
  const particle = document.createElement("span");
  particle.className = "particle";

  if (Math.random() > 0.5) {
    particle.classList.add("purple");
  }

  const size = 1 + Math.random() * 2;

  particle.style.width = size + "px";
  particle.style.height = size + "px";
  particle.style.left = Math.random() * 100 + "%";
  particle.style.top = Math.random() * 100 + "%";
  particle.style.animationDuration = (7 + Math.random() * 12) + "s";
  particle.style.animationDelay = (Math.random() * 8) + "s";

  particleArea.appendChild(particle);
}

/* NAVIGATION STATE */
const enterButton = document.getElementById("enterButton");

let navigationStarted = false;

/* RESET PAGE WHEN RESTORED */
function restoreWelcomePage() {
  navigationStarted = false;

  document.body.classList.remove("leaving");

  enterButton.disabled = false;
  enterButton.innerHTML =
    'ENTER <span aria-hidden="true">→</span>';
}

/* Initial load, browser Back and Forward */
window.addEventListener("pageshow", function () {
  restoreWelcomePage();
});

/* ENTER BUTTON */
enterButton.addEventListener("click", function () {
  if (navigationStarted) return;

  navigationStarted = true;
  enterButton.disabled = true;

  document.body.classList.add("leaving");

  setTimeout(function () {
    window.location.href = "./license.html";
  }, 550);
});
</script>

</body>
