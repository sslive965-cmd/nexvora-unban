<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#05000d">
<title>NEXVORA UNBAN</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  min-height:100%;
  overflow:hidden;
  background:#020006;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
}

body{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= BACKGROUND ================= */

.background{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 42%,rgba(126,0,255,.20),transparent 28%),
    radial-gradient(circle at 8% 15%,rgba(0,212,255,.10),transparent 24%),
    radial-gradient(circle at 92% 80%,rgba(255,0,174,.10),transparent 25%),
    #020006;
}

.background::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at center,transparent 0%,rgba(0,0,0,.15) 55%,rgba(0,0,0,.72) 100%);
  pointer-events:none;
  z-index:2;
}

/* perspective grid */

.grid{
  position:absolute;
  width:180%;
  height:120%;
  left:-40%;
  top:48%;
  background-image:
    linear-gradient(rgba(137,35,255,.12) 1px,transparent 1px),
    linear-gradient(90deg,rgba(137,35,255,.12) 1px,transparent 1px);
  background-size:48px 48px;
  transform:
    perspective(550px)
    rotateX(67deg);
  transform-origin:center top;
  animation:gridMove 10s linear infinite;
  opacity:.65;
}

@keyframes gridMove{
  from{
    transform:perspective(550px) rotateX(67deg) translateY(0);
  }
  to{
    transform:perspective(550px) rotateX(67deg) translateY(48px);
  }
}

/* ================= GLOW ORBS ================= */

.orb{
  position:absolute;
  border-radius:50%;
  filter:blur(75px);
  opacity:.42;
  pointer-events:none;
}

.orb.one{
  width:280px;
  height:280px;
  left:-100px;
  top:5%;
  background:#7200ff;
  animation:orbOne 8s ease-in-out infinite alternate;
}

.orb.two{
  width:300px;
  height:300px;
  right:-110px;
  bottom:0;
  background:#ec009d;
  animation:orbTwo 9s ease-in-out infinite alternate;
}

.orb.three{
  width:210px;
  height:210px;
  right:18%;
  top:-100px;
  background:#00c8ff;
  animation:orbThree 7s ease-in-out infinite alternate;
}

@keyframes orbOne{
  to{transform:translate(70px,40px) scale(1.18);}
}

@keyframes orbTwo{
  to{transform:translate(-60px,-50px) scale(1.15);}
}

@keyframes orbThree{
  to{transform:translate(-30px,70px) scale(1.2);}
}

/* ================= PARTICLES ================= */

.particles{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.particle{
  position:absolute;
  width:2px;
  height:2px;
  border-radius:50%;
  background:#d9b6ff;
  box-shadow:
    0 0 6px #a63dff,
    0 0 15px rgba(166,61,255,.7);
  animation:particleFloat linear infinite;
}

@keyframes particleFloat{
  0%{
    transform:translate3d(0,110vh,0) scale(.4);
    opacity:0;
  }
  15%{opacity:1;}
  80%{opacity:.8;}
  100%{
    transform:translate3d(30px,-10vh,0) scale(1);
    opacity:0;
  }
}

/* ================= CENTER SYSTEM ================= */

.scene{
  position:relative;
  z-index:5;
  width:min(92%,720px);
  perspective:1200px;
}

.container{
  position:relative;
  padding:58px 28px 48px;
  text-align:center;
  border:1px solid rgba(190,115,255,.35);
  border-radius:32px;
  background:
    linear-gradient(
      145deg,
      rgba(20,5,38,.72),
      rgba(6,2,15,.60)
    );
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  box-shadow:
    0 0 25px rgba(124,0,255,.22),
    0 0 80px rgba(95,0,255,.12),
    inset 0 0 40px rgba(174,0,255,.055);
  animation:
    cardIn 1.2s cubic-bezier(.2,.8,.2,1) forwards,
    cardFloat 6s ease-in-out 1.2s infinite;
}

.container::before{
  content:"";
  position:absolute;
  inset:1px;
  border-radius:31px;
  border:1px solid rgba(255,255,255,.035);
  pointer-events:none;
}

.container::after{
  content:"";
  position:absolute;
  width:45%;
  height:1px;
  top:0;
  left:27.5%;
  background:linear-gradient(
    90deg,
    transparent,
    #bd6cff,
    #fff,
    #bd6cff,
    transparent
  );
  box-shadow:0 0 18px #9e38ff;
}

/* ================= TEXT ================= */

.status{
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-bottom:22px;
  padding:8px 15px;
  border:1px solid rgba(155,73,255,.3);
  border-radius:30px;
  background:rgba(100,0,255,.08);
  color:#cdb8df;
  font-size:10px;
  font-weight:700;
  letter-spacing:3px;
  text-transform:uppercase;
}

.status-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#b74dff;
  box-shadow:0 0 10px #b74dff;
  animation:statusPulse 1.5s ease-in-out infinite;
}

@keyframes statusPulse{
  50%{
    opacity:.35;
    transform:scale(.65);
  }
}

.welcome{
  color:#a999b7;
  font-size:12px;
  letter-spacing:7px;
  text-transform:uppercase;
  margin-bottom:16px;
  animation:textGlow 3s ease-in-out infinite alternate;
}

.logo{
  position:relative;
  font-size:clamp(44px,11vw,88px);
  line-height:.92;
  font-weight:1000;
  letter-spacing:5px;
  background:
    linear-gradient(
      115deg,
      #ffffff 0%,
      #e7cfff 20%,
      #8d27ff 43%,
      #ffffff 55%,
      #bd55ff 75%,
      #ffffff 100%
    );
  background-size:300% auto;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  filter:
    drop-shadow(0 0 8px rgba(157,60,255,.8))
    drop-shadow(0 0 30px rgba(120,0,255,.4));
  animation:logoMove 5s linear infinite;
}

@keyframes logoMove{
  to{background-position:300% center;}
}

@keyframes textGlow{
  from{opacity:.65;}
  to{opacity:1;}
}

.tagline{
  margin-top:25px;
  color:#c3b4d0;
  font-size:12px;
  line-height:1.8;
  letter-spacing:3px;
  text-transform:uppercase;
}

.divider{
  width:145px;
  height:1px;
  margin:28px auto 25px;
  background:
    linear-gradient(
      90deg,
      transparent,
      #9e43ff,
      #e2b8ff,
      #9e43ff,
      transparent
    );
  box-shadow:0 0 15px rgba(155,45,255,.8);
}

/* ================= ENTER BUTTON ================= */

.enter-btn{
  position:relative;
  display:block;
  width:min(280px,85%);
  height:62px;
  margin:0 auto;
  overflow:hidden;
  border:1px solid rgba(221,181,255,.7);
  border-radius:18px;
  outline:none;
  cursor:pointer;
  color:#fff;
  background:
    linear-gradient(
      135deg,
      rgba(104,0,255,.88),
      rgba(168,0,255,.45)
    );
  font-size:14px;
  font-weight:900;
  letter-spacing:5px;
  box-shadow:
    0 0 20px rgba(139,35,255,.55),
    0 0 55px rgba(111,0,255,.18),
    inset 0 0 22px rgba(255,255,255,.08);
  transition:
    transform .25s ease,
    box-shadow .25s ease;
}

.enter-btn::before{
  content:"";
  position:absolute;
  top:0;
  left:-120%;
  width:65%;
  height:100%;
  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.38),
      transparent
    );
  transform:skewX(-22deg);
  animation:buttonScan 3s ease-in-out infinite;
}

@keyframes buttonScan{
  0%,25%{left:-120%;}
  65%,100%{left:160%;}
}

.enter-btn span{
  position:relative;
  z-index:2;
}

.enter-btn:hover{
  transform:translateY(-4px) scale(1.025);
  box-shadow:
    0 0 28px rgba(158,45,255,.8),
    0 0 75px rgba(121,0,255,.3),
    inset 0 0 25px rgba(255,255,255,.1);
}

.enter-btn:active{
  transform:scale(.96);
}

.enter-btn.loading{
  pointer-events:none;
  opacity:.75;
}

/* ================= FOOTER ================= */

.footer{
  margin-top:28px;
  color:#71647a;
  font-size:9px;
  letter-spacing:3px;
  text-transform:uppercase;
}

.disclaimer{
  margin-top:12px;
  color:#554b5d;
  font-size:8px;
  letter-spacing:1px;
}

/* ================= CORNER HUD ================= */

.hud{
  position:fixed;
  z-index:4;
  width:100%;
  left:0;
  pointer-events:none;
}

.hud.top{
  top:22px;
}

.hud.bottom{
  bottom:22px;
}

.hud-inner{
  width:min(94%,1100px);
  margin:auto;
  display:flex;
  justify-content:space-between;
  color:rgba(185,150,210,.42);
  font-size:8px;
  letter-spacing:2px;
  text-transform:uppercase;
}

.hud-line{
  display:flex;
  align-items:center;
  gap:8px;
}

.hud-line::before{
  content:"";
  width:24px;
  height:1px;
  background:rgba(172,75,255,.35);
}

/* ================= CARD ANIMATION ================= */

@keyframes cardIn{
  from{
    opacity:0;
    transform:
      translateY(35px)
      rotateX(8deg)
      scale(.94);
  }
  to{
    opacity:1;
    transform:
      translateY(0)
      rotateX(0)
      scale(1);
  }
}

@keyframes cardFloat{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-7px);
  }
}

/* ================= MOBILE ================= */

@media(max-width:600px){

  .container{
    padding:48px 18px 38px;
    border-radius:26px;
  }

  .container::before{
    border-radius:25px;
  }

  .welcome{
    font-size:10px;
    letter-spacing:5px;
  }

  .logo{
    letter-spacing:3px;
  }

  .tagline{
    font-size:9px;
    letter-spacing:2px;
  }

  .enter-btn{
    height:58px;
    border-radius:16px;
  }

  .hud-inner{
    font-size:7px;
  }

  .hud.top{
    top:12px;
  }

  .hud.bottom{
    bottom:12px;
  }
}

@media(max-height:650px){

  .container{
    padding-top:32px;
    padding-bottom:28px;
  }

  .status{
    margin-bottom:14px;
  }

  .tagline{
    margin-top:16px;
  }

  .divider{
    margin:18px auto;
  }

  .footer{
    margin-top:18px;
  }
}
</style>
</head>

<body>

<!-- BACKGROUND -->
<div class="background">

  <div class="grid"></div>

  <div class="orb one"></div>
  <div class="orb two"></div>
  <div class="orb three"></div>

  <div class="particles" id="particles"></div>

</div>

<!-- HUD -->
<div class="hud top">
  <div class="hud-inner">
    <div class="hud-line">NEXVORA SYSTEM</div>
    <div class="hud-line">ONLINE</div>
  </div>
</div>

<div class="hud bottom">
  <div class="hud-inner">
    <div class="hud-line">SECURE ACCESS</div>
    <div class="hud-line">V1.0</div>
  </div>
</div>

<!-- MAIN -->
<main class="scene">

  <section class="container" id="mainCard">

    <div class="status">
      <span class="status-dot"></span>
      SYSTEM ONLINE
    </div>

    <div class="welcome">
      Welcome To
    </div>

    <div class="logo">
      NEXVORA<br>
      UNBAN
    </div>

    <div class="tagline">
      Next-Generation Account Appeal Platform
    </div>

    <div class="divider"></div>

    <button
      class="enter-btn"
      id="enterButton"
      onclick="enterPlatform()"
    >
      <span>ENTER PLATFORM</span>
    </button>

    <div class="footer">
      SECURE • FAST • INDEPENDENT
    </div>

    <div class="disclaimer">
      UNOFFICIAL INDEPENDENT APPEAL-REQUEST SERVICE
    </div>

  </section>

</main>

<script>

/* =========================================
   PARTICLES
========================================= */

const particleBox =
  document.getElementById("particles");

const particleCount =
  window.innerWidth < 600 ? 32 : 55;

for(let i = 0; i < particleCount; i++){

  const particle =
    document.createElement("span");

  particle.className = "particle";

  particle.style.left =
    Math.random() * 100 + "%";

  particle.style.animationDuration =
    (5 + Math.random() * 9) + "s";

  particle.style.animationDelay =
    (Math.random() * 9) + "s";

  const size =
    (1 + Math.random() * 2.5) + "px";

  particle.style.width = size;
  particle.style.height = size;

  particleBox.appendChild(particle);
}


/* =========================================
   ENTER PLATFORM
========================================= */

function enterPlatform(){

  const card =
    document.getElementById("mainCard");

  const button =
    document.getElementById("enterButton");

  button.classList.add("loading");

  button.querySelector("span").textContent =
    "LOADING...";

  card.style.transition =
    "all .7s cubic-bezier(.2,.8,.2,1)";

  card.style.transform =
    "scale(.92) translateY(-25px)";

  card.style.opacity = "0";

  setTimeout(() => {

    /*
      NEXT MODULE:
      license.html

      Ye page next step mein banega.
    */

    window.location.href = "license.html";

  },700);
}


/* =========================================
   PREVENT ACCIDENTAL DOUBLE CLICK
========================================= */

window.addEventListener("pageshow", () => {

  const button =
    document.getElementById("enterButton");

  if(button){
    button.classList.remove("loading");

    const text =
      button.querySelector("span");

    if(text){
      text.textContent =
        "ENTER PLATFORM";
    }
  }

});

</script>

</body>
</html>
