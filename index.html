<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXVORA UNBAN</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #030006;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      color: white;
    }

    /* Animated background */
    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 45%, rgba(111, 0, 255, 0.20), transparent 28%),
        radial-gradient(circle at 20% 20%, rgba(0, 183, 255, 0.10), transparent 25%),
        radial-gradient(circle at 80% 80%, rgba(255, 0, 153, 0.10), transparent 25%),
        #030006;
    }

    .grid {
      position: absolute;
      inset: -50%;
      background-image:
        linear-gradient(rgba(140, 0, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(140, 0, 255, 0.08) 1px, transparent 1px);
      background-size: 45px 45px;
      transform: perspective(500px) rotateX(65deg);
      animation: gridMove 12s linear infinite;
    }

    @keyframes gridMove {
      from {
        transform: perspective(500px) rotateX(65deg) translateY(0);
      }
      to {
        transform: perspective(500px) rotateX(65deg) translateY(45px);
      }
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.45;
      animation: float 8s ease-in-out infinite alternate;
    }

    .orb.one {
      width: 220px;
      height: 220px;
      background: #7b00ff;
      top: 8%;
      left: -5%;
    }

    .orb.two {
      width: 260px;
      height: 260px;
      background: #ff009d;
      right: -8%;
      bottom: 5%;
      animation-delay: 2s;
    }

    .orb.three {
      width: 180px;
      height: 180px;
      background: #00c8ff;
      right: 15%;
      top: -8%;
      animation-delay: 4s;
    }

    @keyframes float {
      from {
        transform: translate(0, 0) scale(1);
      }
      to {
        transform: translate(35px, -30px) scale(1.15);
      }
    }

    /* Particles */
    .particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #c78cff;
      border-radius: 50%;
      box-shadow: 0 0 12px #9d4dff;
      animation: particleFloat linear infinite;
    }

    @keyframes particleFloat {
      from {
        transform: translateY(110vh);
        opacity: 0;
      }
      15% {
        opacity: 1;
      }
      85% {
        opacity: 1;
      }
      to {
        transform: translateY(-10vh);
        opacity: 0;
      }
    }

    /* Main card */
    .container {
      position: relative;
      z-index: 5;
      width: min(92%, 650px);
      padding: 55px 25px;
      text-align: center;
      border: 1px solid rgba(190, 100, 255, 0.35);
      border-radius: 30px;
      background: rgba(10, 4, 20, 0.48);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow:
        0 0 35px rgba(125, 0, 255, 0.22),
        inset 0 0 35px rgba(150, 0, 255, 0.05);
      animation: cardAppear 1.5s ease forwards;
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .welcome {
      font-size: 13px;
      letter-spacing: 6px;
      color: #bda7d8;
      margin-bottom: 20px;
      text-transform: uppercase;
      animation: glowText 3s ease-in-out infinite alternate;
    }

    .logo {
      font-size: clamp(45px, 11vw, 82px);
      font-weight: 900;
      letter-spacing: 5px;
      line-height: 1;
      background: linear-gradient(
        120deg,
        #ffffff,
        #d39cff,
        #8b32ff,
        #ffffff,
        #b83dff
      );
      background-size: 300% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow:
        0 0 15px rgba(157, 68, 255, 0.7),
        0 0 45px rgba(157, 68, 255, 0.35);
      animation: logoShine 5s linear infinite;
    }

    @keyframes logoShine {
      to {
        background-position: 300% center;
      }
    }

    @keyframes glowText {
      from {
        opacity: 0.65;
      }
      to {
        opacity: 1;
      }
    }

    .subtitle {
      margin-top: 22px;
      color: #c5b6d5;
      font-size: 14px;
      letter-spacing: 2px;
      line-height: 1.7;
    }

    .line {
      width: 110px;
      height: 2px;
      margin: 28px auto;
      background: linear-gradient(90deg, transparent, #a53cff, transparent);
      box-shadow: 0 0 15px #9b2fff;
    }

    .enter-btn {
      position: relative;
      margin-top: 10px;
      width: min(260px, 80%);
      height: 58px;
      border: 1px solid rgba(214, 160, 255, 0.65);
      border-radius: 16px;
      background: linear-gradient(
        135deg,
        rgba(102, 0, 255, 0.75),
        rgba(171, 0, 255, 0.35)
      );
      color: white;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 4px;
      cursor: pointer;
      overflow: hidden;
      box-shadow:
        0 0 20px rgba(142, 44, 255, 0.45),
        inset 0 0 20px rgba(255, 255, 255, 0.05);
      transition: 0.3s ease;
    }

    .enter-btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.35),
        transparent
      );
      transform: skewX(-20deg);
      animation: buttonScan 3s infinite;
    }

    @keyframes buttonScan {
      0% {
        left: -100%;
      }
      50%,
      100% {
        left: 150%;
      }
    }

    .enter-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow:
        0 0 30px rgba(157, 44, 255, 0.75),
        0 0 70px rgba(157, 44, 255, 0.25);
    }

    .enter-btn:active {
      transform: scale(0.97);
    }

    .footer {
      margin-top: 28px;
      font-size: 10px;
      letter-spacing: 2px;
      color: #75667f;
    }

    /* Mobile */
    @media (max-width: 500px) {
      .container {
        padding: 45px 18px;
        border-radius: 24px;
      }

      .welcome {
        letter-spacing: 4px;
      }

      .logo {
        letter-spacing: 3px;
      }

      .subtitle {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="background">
    <div class="grid"></div>

    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>

    <div class="particles" id="particles"></div>
  </div>

  <main class="container">

    <div class="welcome">
      Welcome To
    </div>

    <div class="logo">
      NEXVORA<br>UNBAN
    </div>

    <div class="line"></div>

    <div class="subtitle">
      NEXT-GENERATION ACCOUNT APPEAL PLATFORM
    </div>

    <button class="enter-btn" onclick="enterPlatform()">
      ENTER
    </button>

    <div class="footer">
      SECURE • FAST • INDEPENDENT
    </div>

  </main>

  <script>
    // Generate animated particles
    const particleBox = document.getElementById("particles");

    for (let i = 0; i < 45; i++) {
      const particle = document.createElement("span");
      particle.className = "particle";

      particle.style.left = Math.random() * 100 + "%";
      particle.style.animationDuration =
        (5 + Math.random() * 8) + "s";
      particle.style.animationDelay =
        (Math.random() * 8) + "s";

      particleBox.appendChild(particle);
    }

    function enterPlatform() {
      document.querySelector(".container").style.transition =
        "0.7s ease";

      document.querySelector(".container").style.transform =
        "scale(0.92) translateY(-20px)";

      document.querySelector(".container").style.opacity = "0";

      setTimeout(() => {
        // Next page will be connected here.
        alert("NEXVORA UNBAN — Platform loading...");
      }, 700);
    }
  </script>

</body>
  </html>
