<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXVORA UNBAN — Admin Panel</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

body{
  min-height:100vh;
  background:#07030c;
  color:#f7efff;
  font-family:Arial,sans-serif
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer
}

.hidden{
  display:none!important
}

.bg{
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(ellipse at 20% 0%,#51008055,transparent 42%),
    radial-gradient(ellipse at 100% 100%,#34004444,transparent 40%)
}

.brand{
  font-weight:900;
  letter-spacing:2px;
  color:#e0b7ff
}

.login-wrap{
  position:relative;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px
}

.login-card{
  width:min(100%,420px);
  padding:30px 24px;
  border:1px solid #a65cff66;
  border-radius:22px;
  background:#10091bed;
  box-shadow:0 0 45px #922bff20
}

.eyebrow{
  font-size:10px;
  letter-spacing:3px;
  color:#bf8df3;
  margin-top:22px
}

h1{
  font-size:29px;
  margin:12px 0
}

p{
  font-size:13px;
  color:#b7a6c7;
  line-height:1.7
}

label{
  display:block;
  margin:16px 0 8px;
  font-size:12px;
  color:#ddc5f4
}

input,select,textarea{
  width:100%;
  padding:12px 13px;
  border:1px solid #8050a866;
  border-radius:10px;
  background:#08040e;
  color:white;
  outline:none
}

input,select{
  height:46px
}

textarea{
  min-height:100px;
  resize:vertical
}

input:focus,
select:focus,
textarea:focus{
  border-color:#c17aff
}

.btn{
  border:1px solid #c18aff66;
  border-radius:10px;
  min-height:42px;
  padding:0 15px;
  background:#ffffff08;
  color:#fff;
  font-size:11px;
  font-weight:bold;
  letter-spacing:.8px
}

.btn:hover{
  background:#ffffff14
}

.btn.primary{
  background:linear-gradient(110deg,#7000e8,#a52aff)
}

.btn.success{
  border-color:#48e0a055;
  background:#48e0a01a
}

.btn.danger{
  border-color:#ff557755;

}

.btn.full{

}

.message{

  color:#ffb4df;
  font-size:12px
}

.warning{
  margin-top:18px;
  padding:12px;

  border-radius:10px;
  font-size:11px;
  color:#ad9aba;
  line-height:1.6
}

.app{
  position:relative;
  min-height:100vh;
  display:grid;
  grid-template-columns:230px minmax(0,1fr)
}

.sidebar{
  padding:23px 15px;
  border-right:1px solid #a65cff2d;
  background:#0b0611
}

.sidebar .brand{
  padding:0 8px 25px;
  line-height:1.7

.nav{

  text-align:left;

.nav.active,

.side-note{

.main{

.top{

.top h2{

.pill{

}

.content{

.cards{

.stat{

.stat span{

.panel{

.panel h3{

}

.panel p{

}

.row,

.row .btn{

.grid2{

}

.list{

.badge.rejected{

}

.badge.pending{

  background:#ffb84d1a
}

.empty{

  color:#9e8cac;
  font-size:12px
}

.key-box{
  margin-top:14px;
  padding:15px;
  border:1px dashed #c17aff66;
  border-radius:12px;
  background:#08040e
}

.key-value{
  font-family:monospace;

  letter-spacing:1px;

.small,

  color:#9e8cac

.order-box{
  margin-top:12px;
  padding:14px;
  border:1px solid #48e0a044;
  border-radius:12px;
  background:#48e0a00b
}

.order-value{
  font-family:monospace;
  color:#c9ffd9;
  font-size:16px;
  font-weight:bold;
  letter-spacing:1px;
  word-break:break-all
}

.detail-box{
  margin-top:12px;
  padding:14px;
  border:1px solid #a65cff2d;
  border-radius:12px;
  background:#08040e

.detail-row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:7px 0;
  border-bottom:1px solid #a65cff18;
  font-size:11px
}

.detail-row:last-child{
  border-bottom:0
}

.detail-label{
  color:#8f7ca0
}

.detail-value{
  color:#eee0f7;
  text-align:right;
  word-break:break-word
}

.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:20;
  max-width:360px;
  padding:13px 15px;
  border-radius:11px;
  background:#160c20;
  border:1px solid #a65cff66;

  font-size:12px
}

.modal{
  position:fixed;
  inset:0;
  z-index:10;
  display:grid;
  place-items:center;
  padding:18px;
  background:#0009

.modal-card{
  width:min(100%,560px);
  max-height:90vh;
  overflow:auto;
  padding:22px;
  border:1px solid #a65cff55;
  border-radius:18px;
  background:#10091b
}

.copy-inline{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:8px
}

.copy-inline .key-value{

@media(max-width:900px){
  .cards{

@media(max-width:700px){

  .sidebar{
    border-right:0;
    border-bottom:1px solid #a65cff2d;

    grid-template-columns:repeat(2,minmax(0,1fr));

  }

  .nav{
    margin:0

  .side-note{
    display:none

  .main{
    padding:17px

  .cards,
  .grid2{
    grid-template-columns:1fr
  }

  .detail-row{
    flex-direction:column;
    gap:3px
  }

  .detail-value{
    text-align:left
  }
}
</style>

<script>  
  const SUPABASE_URL="https://sitgwrnvxaugresvlvfl.supabase.co";
const SUPABASE_KEY="sb_publishable_vrTWTdch4_6ZyH57htbWPQ_Bc0G1SEZ";

const db=window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const $=id=>document.getElementById(id);

let currentSection="overview";

const names={
  overview:"Dashboard",
  licenses:"License Keys",
  forms:"Unban Forms",
  payments:"Payments",
  telegram:"Telegram",
  settings:"Settings"
};

function esc(v){
  return String(v??"").replace(
    /[&<>"']/g,
    c=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );
}

function toast(t){
  $("toastRoot").innerHTML=
    '<div class="toast">'+esc(t)+'</div>';

  setTimeout(()=>{
    $("toastRoot").innerHTML="";
  },3200);
}

function msg(t,e=true){
  $("loginMessage").textContent=t;
  $("loginMessage").style.color=
    e ? "#ffb4df" : "#b5ffcf";
}

function date(v){
  if(!v)return"—";

  const d=new Date(v);

  return isNaN(d)
    ? String(v)
    : d.toLocaleString();
}

function badge(s){
  s=String(s||"unknown");

  let c;

  if(
    [
      "active",
      "verified",
      "completed",
      "approved",
      "payment_verified",
      "submitted",
      "in_review"
    ].includes(s)
  ){
    c="verified";
  }else if(
    [
      "revoked",
      "rejected",
      "declined",
      "cancelled"
    ].includes(s)
  ){
    c="rejected";
  }else{
    c="pending";
  }

  return '<span class="badge '+c+'">'+
    esc(s)+
    '</span>';
}

async function user(){
  return (
    await db.auth.getUser()
  ).data.user || null;
}

async function hash(t){
  const d=await crypto.subtle.digest(
    "SHA-256",
    new TextEncoder().encode(t)
  );

  return Array.from(
    new Uint8Array(d)
  )
  .map(x=>x.toString(16).padStart(2,"0"))
  .join("");
}

function rnd(n){
  const s=
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  const a=new Uint32Array(n);

  crypto.getRandomValues(a);

  return Array.from(
    a,
    x=>s[x%s.length]
  ).join("");
}

function makeOrderId(){
  const a=new Uint8Array(6);

  crypto.getRandomValues(a);

  const hex=Array.from(
    a,
    x=>x.toString(16).padStart(2,"0")
  ).join("").toUpperCase();

  return "NXU-"+hex;
}

async function verify(u){
  if(!u?.email)return false;

  const r=await db
    .from("admin_allowlist")
    .select("email")
    .eq("email",u.email)
    .maybeSingle();

  if(r.error)throw r.error;

  return !!r.data;
}

  $("loginView").classList.add("hidden");

function showLogin(){

async function overview(){

  const [
    a,
    b,
    c,
    d

    db

      .select("id",{count:"exact",head:true})
      .eq("status","payment_pending"),

    db
      .from("telegram_events")
      .select("id",{count:"exact",head:true})

  ]);

  [a,b,c,d].forEach(r=>{

  });

  $("sectionContent").innerHTML=`

    <p>
      Welcome to the NEXVORA UNBAN control center.
    </p>

    <div class="cards">

      <div class="stat">
        <span>License Keys</span>
        <strong>${a.count??0}</strong>
      </div>

      <div class="stat">
        <span>Unban Forms</span>
        <strong>${b.count??0}</strong>
      </div>

      <div class="stat">
        <span>Pending Payments</span>
        <strong>${c.count??0}</strong>
      </div>

      <div class="stat">
        <span>Telegram Events</span>
        <strong>${d.count??0}</strong>
      </div>

    </div>

    <div class="panel">

      <h3>System Status</h3>

      <p>
        Supabase connection is active.
        Admin authentication is verified.
      </p>

    </div>

    <div class="panel">

      <h3>Service Notice</h3>

      <p>
        This is an independent appeal-request assistance
        service, not an official Garena panel.
        No unban result is guaranteed.
      </p>

    </div>

}

async function licenses(){

  const r=await db
    .from("license_keys")
    .select(
      "id,key_prefix,status,customer_email,created_at,expires_at,approved_at,notes"
    )
    .order("created_at",{ascending:false})
    .limit(100);

  if(r.error)throw r.error;

  $("sectionContent").innerHTML=`

    <div class="panel">

      <div class="top">

        <h3>License Keys</h3>

        <button
          class="btn primary"
          onclick="genModal()"
        >
          ＋ GENERATE KEY
        </button>

      </div>

      <p>
        Generated license secrets are shown once.
        Database stores only a SHA-256 hash.
      </p>

      <div class="actions">

        <button
          class="btn"
          onclick="licenses()"
        >
          ↻ REFRESH
        </button>

      </div>

      ${
        r.data.length
        ?
        r.data.map(x=>`

          <div class="list">

            <strong>
              ${esc(x.key_prefix||"License")}
            </strong>

            ${badge(x.status)}

            <br>

            Customer:
            ${esc(x.customer_email||"Not assigned")}

            <br>

            Created:
            ${esc(date(x.created_at))}

            <br>

            Expires:
            ${esc(date(x.expires_at))}

            ${
              x.notes
              ?
              `<br>Notes: ${esc(x.notes)}`
              :
              ""
            }

            <div class="actions">

              ${
                x.status==="active"
                ?
                `
                <button
                  class="btn danger"
                  onclick="revoke('${x.id}')"
                >
                  REVOKE
                </button>
                `
                :
                ""
              }

              <button
                class="btn danger"
                onclick="delKey('${x.id}')"
              >
                DELETE
              </button>

            </div>

          </div>

        `).join("")
        :
        `
        <div class="empty">
          No license records found.
        </div>
        `
      }

    </div>
  `;
}

function genModal(){

  $("modalRoot").innerHTML=`

    <div class="modal">

      <div class="modal-card">

        <h3>
          Generate License Key
        </h3>

        <p>
          Optional customer email assignment.
        </p>

        <label>
          Customer Email
        </label>

        <input
          id="genEmail"
          type="email"
          placeholder="customer@example.com"
        >

        <div class="actions">

          <button
            class="btn primary"
            onclick="generate()"
          >
            GENERATE
          </button>

          <button
            class="btn"
            onclick="$('modalRoot').innerHTML=''"
          >

          </button>

        </div>

      </div>

    </div>
  `;
}

async function generate(){

  try{

    const key=
      "NX-"+
      rnd(4)+
      "-"+
      rnd(2);

    const r=await db
      .from("license_keys")
      .insert({

        key_hash:await hash(key),

        key_prefix:key,

        status:"active",

        customer_email:
          $("genEmail")
            .value
            .trim()
            .toLowerCase() || null,

        approved_by:
          (await user())?.id || null,

        approved_at:
          new Date().toISOString()

      });

    if(r.error)throw r.error;

    $("modalRoot").innerHTML=`

      <div class="modal">

        <div class="modal-card">

          <h3>
            License Generated
          </h3>

          <p>
            Copy this key now.
            The full key is not stored in plaintext.
          </p>

          <div class="key-box">

            <div class="key-value">
              ${esc(key)}
            </div>

          </div>

          <div class="actions">

            <button
              class="btn primary"
              onclick='copyKey(${JSON.stringify(key)})'
            >
              COPY KEY
            </button>

            <button
              class="btn"
              onclick="$('modalRoot').innerHTML=''"
            >
              DONE
            </button>

          </div>

        </div>

      </div>
    `;

    toast("License generated");

    await licenses();

  }catch(e){

    toast(
      "Generate failed: "+
      (e.message||"Unknown error")
    );

  }
}

async function copyKey(k){

  try{

    await navigator.clipboard.writeText(k);

    toast("License key copied");

  }catch(e){

    toast(
      "Copy failed; copy manually"
    );

  }
}

async function revoke(id){

  if(
    !confirm(
      "Revoke this license? It will no longer be active."
    )
  ){
    return;
  }

  const r=await db
    .from("license_keys")
    .update({
      status:"revoked"
    })
    .eq("id",id);

  if(r.error){
    return toast(r.error.message);
  }

  toast("License revoked");

  await licenses();
}

async function delKey(id){

  if(
    !confirm(
      "Delete this license permanently?"
    )
  ){
    return;
  }

  const r=await db
    .from("license_keys")
    .delete()
    .eq("id",id);

  if(r.error){
    return toast(r.error.message);
  }

  toast("License deleted");

  await licenses();
}

async function forms(paymentOnly=false){

  let q=db
    .from("unban_forms")
    .select("*")
    .order("created_at",{ascending:false})
    .limit(100);

  if(paymentOnly){

    q=q.eq(
      "status",
      "payment_pending"
    );

  }

  const r=await q;

  if(r.error)throw r.error;

  $("sectionContent").innerHTML=`

    <div class="panel">

      <div class="top">

        <h3>
          ${
            paymentOnly
            ?
            "Payments Awaiting Review"
            :
            "Unban Forms"

async function saveForm(id){

  try{

    const st=$("formStatus").value;

    const notes=
      $("formNotes")
        .value
        .trim()||
      null;

    const now=
      new Date().toISOString();

    const current=await db
      .from("unban_forms")
      .select(
        "id,order_id,status,payment_utr,payment_verified_at"
      )
      .eq("id",id)
      .maybeSingle();

    if(current.error){
      throw current.error;
    }

    if(!current.data){
      throw new Error(
        "Form record not found."
      );
    }

    const existing=current.data;

    const vals={
      status:st,
      notes:notes,
      updated_at:now
    };

    /*
      PAYMENT VERIFIED FLOW

      Final Order ID is created ONLY here,
      when the administrator verifies payment.

      A PENDING-* ID is temporary and must
      never be shown as the final Order ID.
    */

    if(st==="payment_verified"){

      let finalOrderId=
        existing.order_id;

      if(
        !finalOrderId ||
        String(finalOrderId)
          .startsWith("PENDING-")
      ){

        finalOrderId=
          makeOrderId();

      }

      vals.order_id=
        finalOrderId;

      vals.payment_verified_by=
        (await user())?.id||
        null;

      vals.payment_verified_at=
        existing.payment_verified_at||
        now;

    }

    /*
      If payment is changed away from
      payment_verified, we do NOT delete
      an already generated final Order ID.
    */

    const r=await db
      .from("unban_forms")
      .update(vals)
      .eq("id",id);

    if(r.error){
      throw r.error;
    }

    $("modalRoot").innerHTML="";

    if(st==="payment_verified"){

      const refreshed=await db
        .from("unban_forms")
        .select(
          "order_id,status"
        )
        .eq("id",id)
        .maybeSingle();

      if(refreshed.error){
        throw refreshed.error;
      }

      const orderId=
        refreshed.data?.order_id||
        vals.order_id||
        "—";

      toast(
        "Payment verified. Final Order ID: "+
        orderId
      );

    }else{

      toast(
        "Form updated successfully"
      );

    }

    await render(currentSection);

  }catch(e){

    toast(
      "Update failed: "+
      (e.message||"Unknown error")
    );

  }
}

async function saveSettings(){

    const uid=
      (await user())?.id||
      null;

    const vals=[

      [
        "license_price_inr",
        Number($("sLic").value)||0
      ],

      [
        "request_price_inr",
        Number($("sReq").value)||0
      ],

        "payment_upi_id",
        $("sUpi").value.trim()
      ],

      [
        "support_username",
        $("sSup").value.trim()
      ],

      [
        "service_disclaimer",
        $("sDis").value.trim()
      ]

    ];

    for(
      const [key,value]
      of vals
    ){

      const r=await db
        .from("site_settings")
        .upsert(
          {
            key,
            value,
            updated_by:uid,
            updated_at:
              new Date().toISOString()
          },
          {
            onConflict:"key"
          }
        );

      if(r.error){
        throw r.error;
      }

    }

    toast(
      "Settings saved successfully"
    );

    await settings();

  }catch(e){

    toast(
      "Save failed: "+
      (e.message||"Unknown error")
    );

  }

    </div>
  `;

  try{

    const loader=
      loaders[currentSection];

      throw new Error(
        "Section loader not found."

    await loader();

  }catch(e){

    $("sectionContent").innerHTML=`

}

async function handleLogin(e){

  e.preventDefault();

  const loginButton=
    $("loginButton");

  loginButton.disabled=true;

  msg(
    "Signing in...",
    false
  );

  try{

    const email=
      $("email")
        .value
        .trim()
        .toLowerCase();

    const password=
      $("password").value;

    if(!email){
      throw new Error(
        "Enter your admin email."
      );
    }

    if(!password){
      throw new Error(
        "Enter your password."
      );
    }

    const r=
      await db.auth.signInWithPassword({
        email,
        password
      });

    if(r.error){
      throw r.error;
    }

    const authorized=
      await verify(r.data.user);

    if(!authorized){

      await db.auth.signOut();

      throw new Error(
        "This account is not authorized for the admin panel."
      );
    }

    msg(
      "Login successful.",
      false
    );

    showAdmin();

    $("password").value="";

    await render("overview");

  }catch(e){

    msg(
      e.message||
      "Login failed."
    );

  }finally{

    loginButton.disabled=false;

  }
}

async function handleLogout(){

  try{

    await db.auth.signOut();

    showLogin();

    $("password").value="";

    $("email").value="";

    $("sectionContent").innerHTML="";

      "Logged out successfully.",
      false
    );

  }catch(e){

    toast(
      "Logout failed: "+
      (e.message||
       "Unknown error")
    );

  }
}

db.auth.onAuthStateChange(
  async(event,session)=>{

    if(
      event==="SIGNED_OUT"
    ){
      showLogin();
      return;
    }

    if(
      event==="SIGNED_IN" &&
      session?.user
    ){

      try{

        const authorized=
          await verify(
            session.user
          );

        if(!authorized){

          await db.auth.signOut();

          msg(
            "This account is not authorized for the admin panel."
          );

          return;
        }

        showAdmin();

        await render(
          currentSection||
          "overview"
        );

      }catch(e){

        await db.auth.signOut();

        msg(
          e.message||
          "Authorization check failed."
        );

      }

    }

  }
);

  try{

      r.data?.session;

    if(!session){

    const authorized=
      await verify(

    if(!authorized){

      await db.auth.signOut();

        "This account is not authorized for the admin panel."
      );

      return;
    }

    showAdmin();

    await render("overview");

  }catch(e){

    showLogin();

    msg(
      e.message||
      "Unable to initialize admin panel."
    );

  }

})();
