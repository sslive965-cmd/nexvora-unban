<script>
const SUPABASE_URL = "https://sitgwrnvxaugresvlvfl.supabase.co";
const SUPABASE_KEY = "sb_publishable_vrTWTdch4_6ZyH57htbWPQ_Bc0G1SEZ";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let currentSection = "dashboard";

const $ = (id) => document.getElementById(id);

function toast(message, type = "success") {
  const root = $("toastRoot");
  if (!root) return alert(message);

  root.innerHTML = "";
  const item = document.createElement("div");
  item.className = "toast " + type;
  item.textContent = message;
  root.appendChild(item);

  setTimeout(() => item.remove(), 3500);
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

function formatDate(value) {
  if (!value) return "—";
  return new Date(value).toLocaleString("en-IN");
}

function makeButton(label, action, className = "") {
  return `<button class="${className}" onclick="${action}">${label}</button>`;
}

async function getCount(table, filters = []) {
  let query = db.from(table).select("*", { count: "exact", head: true });
  filters.forEach(([column, value]) => query = query.eq(column, value));
  const { count, error } = await query;
  if (error) throw error;
  return count || 0;
}

/* LICENSE KEY GENERATION */

function randomPart(length) {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const bytes = crypto.getRandomValues(new Uint8Array(length));
  return Array.from(bytes, byte => chars[byte % chars.length]).join("");
}

function generateLicenseCode() {
  return "NX-" + randomPart(4) + "-" + randomPart(4) + "-" + randomPart(4);
}

async function hashLicense(code) {
  const data = new TextEncoder().encode(code);
  const digest = await crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(digest))
    .map(byte => byte.toString(16).padStart(2, "0"))
    .join("");
}

async function createLicense() {
  const button = $("generateLicenseBtn");
  if (button) button.disabled = true;

  try {
    const code = generateLicenseCode();
    const hash = await hashLicense(code);

    const { error } = await db.from("license_keys").insert({
      key_hash: hash,
      key_prefix: code,
      status: "active",
      notes: "Generated from admin panel"
    });

    if (error) throw error;

    $("generatedLicense").innerHTML = `
      <div class="generated-code">
        <strong>${escapeHTML(code)}</strong>
        <button onclick="copyText('${code}')">Copy</button>
      </div>
    `;

    toast("License key generated successfully.");
    await loadLicenses();
  } catch (error) {
    toast("License generation failed: " + error.message, "error");
  } finally {
    if (button) button.disabled = false;
  }
}

async function copyText(value) {
  try {
    await navigator.clipboard.writeText(value);
    toast("Copied successfully.");
  } catch {
    const field = document.createElement("textarea");
    field.value = value;
    document.body.appendChild(field);
    field.select();
    document.execCommand("copy");
    field.remove();
    toast("Copied successfully.");
  }
}

async function loadLicenses() {
  const content = $("content");
  content.innerHTML = `<div class="loading">Loading license keys...</div>`;

  try {
    let allRows = [];
    let start = 0;
    const pageSize = 500;

    while (true) {
      const { data, error } = await db
        .from("license_keys")
        .select("id,key_prefix,status,customer_email,payment_utr,created_at,expires_at")
        .order("created_at", { ascending: false })
        .range(start, start + pageSize - 1);

      if (error) throw error;

      allRows = allRows.concat(data || []);
      if (!data || data.length < pageSize) break;
      start += pageSize;
    }

    const rows = allRows.map(item => `
      <tr>
        <td><code>${escapeHTML(item.key_prefix || "Unavailable")}</code></td>
        <td><span class="status-badge ${escapeHTML(item.status)}">${escapeHTML(item.status)}</span></td>
        <td>${escapeHTML(item.customer_email || "—")}</td>
        <td>${formatDate(item.created_at)}</td>
        <td class="action-cell">
          <button onclick="copyText('${escapeHTML(item.key_prefix || "")}')">Copy</button>
          <button onclick="revokeLicense('${item.id}')">Revoke</button>
          <button class="danger-btn" onclick="deleteLicense('${item.id}')">Delete</button>
        </td>
      </tr>
    `).join("");

    content.innerHTML = `
      <div class="page-heading">
        <h1>License Keys</h1>
        <p>Generate and manage all license codes.</p>
      </div>

      <div class="panel">
        <h2>Generate New License</h2>
        <button id="generateLicenseBtn" class="primary-btn" onclick="createLicense()">+ Generate License Key</button>
        <div id="generatedLicense"></div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h2>All License Keys (${allRows.length})</h2>
          <button onclick="loadLicenses()">Refresh</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>License Code</th>
                <th>Status</th>
                <th>Customer</th>
                <th>Created</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${rows || `<tr><td colspan="5">No license records found.</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
    `;
  } catch (error) {
    content.innerHTML = `<div class="error-box">License loading error: ${escapeHTML(error.message)}</div>`;
  }
}

async function revokeLicense(id) {
  if (!confirm("Are you sure you want to revoke this license?")) return;

  try {
    const { error } = await db
      .from("license_keys")
      .update({ status: "revoked" })
      .eq("id", id);

    if (error) throw error;

    toast("License revoked.");
    await loadLicenses();
  } catch (error) {
    toast("Revoke failed: " + error.message, "error");
  }
}

async function deleteLicense(id) {
  if (!confirm("Permanently delete this license record?")) return;

  try {
    const { error } = await db
      .from("license_keys")
      .delete()
      .eq("id", id);

    if (error) throw error;

    toast("License deleted.");
    await loadLicenses();
  } catch (error) {
    toast("Delete failed: " + error.message, "error");
  }
}

function makeFinalOrderId() {
  const bytes = crypto.getRandomValues(new Uint8Array(6));
  return "NXU-" + Array.from(bytes, byte => byte.toString(16).padStart(2, "0")).join("").toUpperCase();
}

async function approvePayment(id) {
  if (!confirm("Have you independently confirmed ₹399 was received?")) return;

  try {
    const { data: form, error: readError } = await db
      .from("unban_forms")
      .select("id,order_id,status")
      .eq("id", id)
      .single();

    if (readError) throw readError;

    if (form.status !== "payment_pending") {
      throw new Error("This payment is no longer pending review.");
    }

    const finalOrderId = !form.order_id || form.order_id.startsWith("PENDING-")
      ? makeFinalOrderId()
      : form.order_id;

    const { data, error } = await db
      .from("unban_forms")
      .update({
        order_id: finalOrderId,
        status: "payment_verified",
        payment_verified_by: currentUser.id,
        payment_verified_at: new Date().toISOString(),
        updated_at: new Date().toISOString()
      })
      .eq("id", id)
      .eq("status", "payment_pending")
      .select("id,order_id,status")
      .maybeSingle();

    if (error) throw error;
    if (!data) throw new Error("No record updated. Check admin permissions or refresh the page.");

    closeModal();
    toast("Payment verified. Order ID: " + data.order_id);
    await loadPayments();
  } catch (error) {
    toast("Verification failed: " + error.message, "error");
  }
}

async function rejectPayment(id) {
  if (!confirm("Reject this payment submission?")) return;

  try {
    const { data, error } = await db
      .from("unban_forms")
      .update({
        status: "rejected",
        updated_at: new Date().toISOString()
      })
      .eq("id", id)
      .eq("status", "payment_pending")
      .select("id")
      .maybeSingle();

    if (error) throw error;
    if (!data) throw new Error("No record updated. Check admin permissions or refresh.");

    closeModal();
    toast("Payment rejected.");
    await loadPayments();
  } catch (error) {
    toast("Reject failed: " + error.message, "error");
  }
}

async function loadTelegram() {
  const content = $("content");
  content.innerHTML = `<div class="loading">Loading Telegram events...</div>`;

  try {
    const { data, error } = await db
      .from("telegram_events")
      .select("*")
      .order("created_at", { ascending: false })
      .limit(200);

    if (error) throw error;

    const rows = (data || []).map(event => `
      <tr>
        <td>${escapeHTML(event.telegram_user_id || "—")}</td>
        <td>${escapeHTML(event.event_type || "—")}</td>
        <td>${formatDate(event.created_at)}</td>
        <td><button onclick="viewTelegramEvent('${event.id}')">View</button></td>
      </tr>
    `).join("");

    content.innerHTML = `
      <div class="page-heading">
        <h1>Telegram Events</h1>
        <p>Recent events already recorded in the database.</p>
      </div>
      <div class="panel">
        <div class="panel-header">
          <h2>Recent Events (${(data || []).length})</h2>
          <button onclick="loadTelegram()">Refresh</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Telegram User ID</th><th>Event</th><th>Date</th><th>Action</th></tr></thead>
            <tbody>${rows || `<tr><td colspan="4">No Telegram events recorded yet.</td></tr>`}</tbody>
          </table>
        </div>
        <p class="muted">Payment notifications to your private Telegram channel still require the bot to be added as an administrator and the channel ID to be configured.</p>
      </div>
    `;
  } catch (error) {
    content.innerHTML = `<div class="error-box">Telegram error: ${escapeHTML(error.message)}</div>`;
  }
}

async function viewTelegramEvent(id) {
  try {
    const { data, error } = await db
      .from("telegram_events")
      .select("*")
      .eq("id", id)
      .single();

    if (error) throw error;

    $("modalRoot").innerHTML = `
      <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
        <div class="modal">
          <div class="modal-header">
            <h2>Telegram Event</h2>
            <button onclick="closeModal()">×</button>
          </div>
          <div class="detail-list">
            <div class="detail-row"><span>Event</span><strong>${escapeHTML(data.event_type)}</strong></div>
            <div class="detail-row"><span>User ID</span><strong>${escapeHTML(data.telegram_user_id)}</strong></div>
            <div class="detail-row"><span>Date</span><strong>${formatDate(data.created_at)}</strong></div>
          </div>
          <pre class="json-view">${escapeHTML(JSON.stringify(data.payload || {}, null, 2))}</pre>
          <button class="secondary-btn" onclick="closeModal()">Close</button>
        </div>
      </div>
    `;
  } catch (error) {
    toast("Unable to open event: " + error.message, "error");
  }
}

/* SITE SETTINGS */

async function loadSettings() {
  const content = $("content");
  content.innerHTML = `<div class="loading">Loading settings...</div>`;

  try {
    const { data, error } = await db
      .from("site_settings")
      .select("key,value,updated_at")
      .order("key");

    if (error) throw error;

    const settings = {};
    (data || []).forEach(row => settings[row.key] = row.value);

    const price = settings.license_price_inr ?? 99;
    const upi = settings.upi_id ?? "jinwoo40054@kphdfc";
    const support = settings.support_username ?? "@NEXVORA_X";
    const channel = settings.telegram_channel ?? "https://t.me/+CDLeQTcwWGszNDBl";

    content.innerHTML = `
      <div class="page-heading">
        <h1>Site Settings</h1>
        <p>Update the values used by your website.</p>
      </div>
      <div class="panel">
        <form id="settingsForm">
          <label>License Price (INR)</label>
          <input id="settingPrice" type="number" min="1" value="${escapeHTML(price)}" required>

          <label>UPI ID</label>
          <input id="settingUpi" value="${escapeHTML(upi)}" required>

          <label>Support Username</label>
          <input id="settingSupport" value="${escapeHTML(support)}" required>

          <label>Telegram Channel URL</label>
          <input id="settingChannel" type="url" value="${escapeHTML(channel)}" required>

          <button class="primary-btn" type="submit">Save Settings</button>
        </form>
      </div>
    `;

    $("settingsForm").addEventListener("submit", saveSettings);
  } catch (error) {
    content.innerHTML = `<div class="error-box">Settings error: ${escapeHTML(error.message)}</div>`;
  }
}

async function saveSettings(event) {
  event.preventDefault();

  const entries = [
    ["license_price_inr", Number($("settingPrice").value)],
    ["upi_id", $("settingUpi").value.trim()],
    ["support_username", $("settingSupport").value.trim()],
    ["telegram_channel", $("settingChannel").value.trim()]
  ];

  if (!Number.isFinite(entries[0][1]) || entries[0][1] <= 0) {
    toast("Enter a valid license price.", "error");
    return;
  }

  try {
    for (const [key, value] of entries) {
      const { error } = await db.from("site_settings").upsert({
        key,
        value: JSON.stringify(value),
        updated_by: currentUser.id,
        updated_at: new Date().toISOString()
      }, { onConflict: "key" });

      if (error) throw error;
    }

    toast("Settings saved successfully.");
    await loadSettings();
  } catch (error) {
    toast("Settings save failed: " + error.message, "error");
  }
}

/* NAVIGATION */

async function showSection(section) {
  currentSection = section;

  document.querySelectorAll("[data-section]").forEach(item => {
    item.classList.toggle("active", item.dataset.section === section);
  });

  const loaders = {
    dashboard: loadDashboard,
    licenses: loadLicenses,
    forms: loadUnbanForms,
    payments: loadPayments,
    telegram: loadTelegram,
    settings: loadSettings
  };

  if (!loaders[section]) {
    toast("Unknown section.", "error");
    return;
  }

  await loaders[section]();
}

/* LOGIN + SESSION */

async function checkAdminAccess(user) {
  const { data, error } = await db
    .from("admin_allowlist")
    .select("email")
    .eq("email", (user.email || "").toLowerCase())
    .maybeSingle();

  if (error) throw error;
  if (!data) throw new Error("This account is not authorized as an admin.");

  currentUser = user;
}

async function showAdminApp() {
  $("loginView").classList.add("hidden");
  $("adminApp").classList.remove("hidden");
  await showSection("dashboard");
}

async function loginAdmin(event) {
  event.preventDefault();

  const email = $("loginEmail").value.trim().toLowerCase();
  const password = $("loginPassword").value;

  const button = $("loginButton");
  if (button) button.disabled = true;

  try {
    const { data, error } = await db.auth.signInWithPassword({
      email,
      password
    });

    if (error) throw error;

    await checkAdminAccess(data.user);
    await showAdminApp();
    toast("Admin login successful.");
  } catch (error) {
    await db.auth.signOut();
    currentUser = null;
    toast(error.message || "Login failed.", "error");
  } finally {
    if (button) button.disabled = false;
  }
}

async function logoutAdmin() {
  await db.auth.signOut();
  currentUser = null;
  $("adminApp").classList.add("hidden");
  $("loginView").classList.remove("hidden");
  toast("Logged out.");
}

async function initializeAdmin() {
  try {
    const { data, error } = await db.auth.getSession();
    if (error) throw error;

    const user = data.session?.user;
    if (user) {
      await checkAdminAccess(user);
      await showAdminApp();
    } else {
      $("adminApp").classList.add("hidden");
      $("loginView").classList.remove("hidden");
    }
  } catch (error) {
    await db.auth.signOut();
    currentUser = null;
    $("adminApp").classList.add("hidden");
    $("loginView").classList.remove("hidden");
    toast(error.message || "Please log in again.", "error");
  }
}

document.addEventListener("DOMContentLoaded", () => {
  const loginForm = $("loginForm");
  if (loginForm) loginForm.addEventListener("submit", loginAdmin);

  document.querySelectorAll("[data-section]").forEach(item => {
    item.addEventListener("click", () => showSection(item.dataset.section));
  });

  const logoutButton = $("logoutButton");
  if (logoutButton) logoutButton.addEventListener("click", logoutAdmin);

  initializeAdmin();
});
</script>
