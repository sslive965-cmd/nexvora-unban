<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXVORA UNBAN — License</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background: #030006;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 45%, rgba(119, 0, 255, .22), transparent 30%),
        radial-gradient(circle at 10% 90%, rgba(255, 0, 179, .10), transparent 25%),
        radial-gradient(circle at 90% 10%, rgba(0, 183, 255, .10), transparent 25%),
        #030006;
    }

    .grid {
      position: absolute;
      width: 200%;
      height: 200%;
      left: -50%;
      top: 35%;
      background-image:
        linear-gradient(rgba(151, 50, 255, .08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(151, 50, 255, .08) 1px, transparent 1px);
      background-size: 42px 42px;
      transform: perspective(500px) rotateX(62deg);
      animation: gridMove 12s linear infinite;
    }

    @keyframes gridMove {
      from {
        transform: perspective(500px) rotateX(62deg) translateY(0);
      }
      to {
        transform: perspective(500px) rotateX(62deg) translateY(42px);
      }
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .38;
      animation: float 8s ease-in-out infinite alternate;
    }

    .orb1 {
      width: 230px;
      height: 230px;
      background: #7300ff;
      left: -80px;
      top: 10%;
    }

    .orb2 {
      width: 260px;
      height: 260px;
      background: #ff008c;
      right: -100px;
      bottom: 0;
      animation-delay: 2s;
    }

    @keyframes float {
      to {
        transform: translate(35px, -25px) scale(1.12);
      }
    }

    .card {
      position: relative;
      z-index: 5;
      width: min(92%, 460px);
      padding: 42px 25px 35px;
      border: 1px solid rgba(194, 116, 255, .38);
      border-radius: 28px;
      background: rgba(11, 5, 22, .58);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow:
        0 0 35px rgba(125, 0, 255, .25),
        inset 0 0 30px rgba(170, 70, 255, .05);
      text-align: center;
      animation: appear .8s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(25px) scale(.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .brand {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #d8b8ff;
      text-shadow: 0 0 15px rgba(178, 83, 255, .7);
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(32px, 9vw, 48px);
      letter-spacing: 3px;
      font-weight: 900;
      background: linear-gradient(110deg, #fff, #b75cff, #8b2dff, #fff);
      background-size: 250% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 4s linear infinite;
    }

    @keyframes shine {
      to {
        background-position: 250% center;
      }
    }

    .description {
      margin: 15px 0 28px;
      color: #aaa0b5;
      font-size: 13px;
      line-height: 1.6;
    }

    .input-wrap {
      position: relative;
      margin-bottom: 16px;
    }

    input {
      width: 100%;
      height: 58px;
      border: 1px solid rgba(185, 100, 255, .35);
      outline: none;
      border-radius: 15px;
      padding: 0 18px;
      background: rgba(0, 0, 0, .35);
      color: white;
      font-size: 14px;
      letter-spacing: 2px;
      text-align: center;
      transition: .3s;
    }

    input::placeholder {
      color: #756b80;
      letter-spacing: 1px;
    }

    input:focus {
      border-color: #b64dff;
      box-shadow:
        0 0 18px rgba(161, 50, 255, .25),
        inset 0 0 15px rgba(161, 50, 255, .05);
    }

    button {
      width: 100%;
      height: 54px;
      border-radius: 15px;
      border: 1px solid rgba(208, 151, 255, .55);
      color: white;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 3px;
      cursor: pointer;
      transition: .3s;
    }

    .verify {
      position: relative;
      overflow: hidden;
      background: linear-gradient(
        135deg,
        #7100ff,
        #a900ff
      );
      box-shadow:
        0 0 20px rgba(139, 35, 255, .35);
      margin-bottom: 12px;
    }

    .verify::after {
      content: "";
      position: absolute;
      width: 45%;
      height: 100%;
      left: -70%;
      top: 0;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.35),
        transparent
      );
      transform: skewX(-20deg);
      animation: scan 3s infinite;
    }

    @keyframes scan {
      0% {
        left: -70%;
      }
      50%, 100% {
        left: 140%;
      }
    }

    .get-key {
      background: rgba(255,255,255,.025);
      border-color: rgba(184, 105, 255, .35);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 28px rgba(160, 50, 255, .4);
    }

    button:active {
      transform: scale(.98);
    }

    .status {
      min-height: 20px;
      margin-top: 18px;
      font-size: 12px;
      color: #bba8c9;
    }

    .back {
      margin-top: 20px;
      background: none;
      border: none;
      height: auto;
      width: auto;
      color: #75677e;
      font-size: 10px;
      letter-spacing: 2px;
    }

    .back:hover {
      color: #c995ff;
      box-shadow: none;
    }

    @media (max-width: 500px) {
      .card {
        padding: 36px 18px 30px;
      }

      input {
        height: 55px;
      }
    }
  </style>
</head>

<body>

  <div class="bg">
    <div class="grid"></div>
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
  </div>

  <section class="card">

    <div class="brand">NEXVORA</div>

    <h1>UNBAN</h1>

    <p class="description">
      Enter your license key to access the
      NEXVORA UNBAN platform.
    </p>

    <div class="input-wrap">
      <input
        id="licenseKey"
        type="text"
        placeholder="ENTER LICENSE KEY"
        autocomplete="off"
        maxlength="10"
      >
    </div>

    <button class="verify" onclick="verifyKey()">
      VERIFY
    </button>

    <button class="get-key" onclick="getKey()">
      GET KEY
    </button>

    <div class="status" id="status"></div>

    <button class="back" onclick="goBack()">
      ← BACK
    </button>

  </section>

  <script>
    function verifyKey() {
      const input = document.getElementById("licenseKey");
      const status = document.getElementById("status");
      const key = input.value.trim();

      if (!key) {
        status.textContent = "Please enter your license key.";
        status.style.color = "#ff8bd4";
        return;
      }

      status.textContent = "Verifying license...";
      status.style.color = "#cda5ff";

      /*
        Real Supabase license verification
        will be connected in a later step.
      */

      setTimeout(() => {
        status.textContent = "License verification will be connected soon.";
        status.style.color = "#ffb0df";
      }, 900);
    }

    function getKey() {
      window.location.href = "payment-license.html";
    }

    function goBack() {
      window.location.href = "index.html";
    }
  </script>

</body>
      </html>
