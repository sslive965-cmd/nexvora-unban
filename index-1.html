<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#020006">
<title>NEXVORA UNBAN BYPASS </title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  min-height:100%;
  overflow-x:hidden;
  overflow-y:auto;
  overscroll-behavior-y:auto;
  touch-action:pan-y;
  background:#020006;
  font-family:Arial,Helvetica,sans-serif;
  color:white;
}

body{
  position:relative;
}

/* BACKGROUND */

.bg{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 45%,rgba(125,0,255,.22),transparent 30%),
    radial-gradient(circle at 8% 18%,rgba(0,210,255,.09),transparent 25%),
    radial-gradient(circle at 92% 82%,rgba(255,0,180,.10),transparent 25%),
    #020006;
}

.bg::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at center,
      transparent 20%,
      rgba(0,0,0,.12) 55%,
      rgba(0,0,0,.75) 100%);
  pointer-events:none;
}

.grid{
  position:absolute;
  width:200%;
  height:180%;
  left:-50%;
  top:42%;
  background-image:
    linear-gradient(rgba(146,42,255,.10) 1px,transparent 1px),
    linear-gradient(90deg,rgba(146,42,255,.10) 1px,transparent 1px);
  background-size:45px 45px;
  transform:perspective(520px) rotateX(65deg);
  animation:gridMove 10s linear infinite;
}

@keyframes gridMove{
  from{
    transform:perspective(520px) rotateX(65deg) translateY(0);
  }
  to{
    transform:perspective(520px) rotateX(65deg) translateY(45px);
  }
}

.orb{
  position:absolute;
  border-radius:50%;
  filter:blur(85px);
  opacity:.40;
}

.orb1{
  width:270px;
  height:270px;
  left:-100px;
  top:8%;
  background:#7300ff;
  animation:orb1 8s ease-in-out infinite alternate;
}

.orb2{
  width:290px;
  height:290px;
  right:-100px;
  bottom:-20px;
  background:#ff008c;
  animation:orb2 9s ease-in-out infinite alternate;
}

.orb3{
  width:190px;
  height:190px;
  right:18%;
  top:-90px;
  background:#00c8ff;
  animation:orb3 7s ease-in-out infinite alternate;
}

@keyframes orb1{
  to{
    transform:translate(65px,40px) scale(1.18);
  }
}

@keyframes orb2{
  to{
    transform:translate(-55px,-45px) scale(1.15);
  }
}

@keyframes orb3{
  to{
    transform:translate(-35px,70px) scale(1.2);
  }
}

/* PARTICLES */

.particles{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.particle{
  position:absolute;
  width:2px;
  height:2px;
  border-radius:50%;
  background:#dcbcff;
  box-shadow:
    0 0 7px #a53dff,
    0 0 15px #8d21ff;
  animation:particle linear infinite;
}

@keyframes particle{
  0%{
    transform:translateY(110vh);
    opacity:0;
  }

  15%{
    opacity:1;
  }

  85%{
    opacity:.8;
  }

  100%{
    transform:translateY(-10vh);
    opacity:0;
  }
}

/* MAIN */

.screen{
  position:fixed;
  inset:0;
  z-index:5;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  transition:
    opacity .8s ease,
    transform .8s ease;
}

.content{
  width:min(92%,760px);
  padding:25px;
}

/* SYSTEM */

.system{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  margin-bottom:24px;
  color:#a997b8;
  font-size:9px;
  font-weight:bold;
  letter-spacing:4px;
  text-transform:uppercase;
  animation:systemFade 2s ease;
}

.dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#b14dff;
  box-shadow:0 0 12px #b14dff;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  50%{
    opacity:.35;
    transform:scale(.6);
  }
}

@keyframes systemFade{
  from{
    opacity:0;
    transform:translateY(15px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* WELCOME */

.welcome{
  color:#bca9ca;
  font-size:clamp(11px,2vw,14px);
  letter-spacing:8px;
  text-transform:uppercase;
  margin-bottom:18px;
  animation:
    welcomeIn 1.4s ease,
    softGlow 3s ease-in-out infinite alternate;
}

@keyframes welcomeIn{
  from{
    opacity:0;
    transform:translateY(25px);
    letter-spacing:18px;
  }
  to{
    opacity:1;
    transform:translateY(0);
    letter-spacing:8px;
  }
}

@keyframes softGlow{
  from{
    text-shadow:0 0 5px rgba(177,74,255,.15);
  }
  to{
    text-shadow:0 0 18px rgba(177,74,255,.65);
  }
}

/* LOGO */

.logo{
  font-size:clamp(48px,12vw,105px);
  line-height:.88;
  font-weight:1000;
  letter-spacing:5px;
  background:
    linear-gradient(
      115deg,
      #fff,
      #d9b4ff,
      #8c25ff,
      #fff,
      #b744ff,
      #fff
    );
  background-size:350% auto;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;

  filter:
    drop-shadow(0 0 10px rgba(154,54,255,.85))
    drop-shadow(0 0 35px rgba(113,0,255,.45));

  animation:
    logoIn 1.5s cubic-bezier(.2,.8,.2,1),
    logoShine 5s linear infinite;
}

@keyframes logoIn{
  from{
    opacity:0;
    transform:scale(.65);
    filter:blur(14px);
  }
  to{
    opacity:1;
    transform:scale(1);
    filter:
      drop-shadow(0 0 10px rgba(154,54,255,.85))
      drop-shadow(0 0 35px rgba(113,0,255,.45));
  }
}

@keyframes logoShine{
  to{
    background-position:350% center;
  }
}

/* TAGLINE */

.tagline{
  margin-top:27px;
  color:#a99bae;
  font-size:10px;
  letter-spacing:4px;
  text-transform:uppercase;
  animation:fadeUp 1.8s ease;
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(18px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* LINE */

.line{
  width:150px;
  height:1px;
  margin:30px auto;
  background:
    linear-gradient(
      90deg,
      transparent,
      #9c3dff,
      #e4c4ff,
      #9c3dff,
      transparent
    );
  box-shadow:0 0 18px #8f28ff;
}

/* ENTER */

.enter{
  position:relative;
  width:min(285px,82%);
  height:60px;
  border-radius:17px;
  border:1px solid rgba(218,170,255,.65);
  background:
    linear-gradient(
      135deg,
      rgba(103,0,255,.9),
      rgba(170,0,255,.42)
    );
  color:#fff;
  font-size:13px;
  font-weight:900;
  letter-spacing:5px;
  cursor:pointer;
  overflow:hidden;

  box-shadow:
    0 0 22px rgba(140,35,255,.55),
    0 0 55px rgba(111,0,255,.20);

  animation:buttonIn 2s ease;
  transition:.3s ease;
}

@keyframes buttonIn{
  from{
    opacity:0;
    transform:translateY(25px) scale(.9);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.enter::before{
  content:"";
  position:absolute;
  width:55%;
  height:100%;
  left:-100%;
  top:0;
  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.4),
      transparent
    );
  transform:skewX(-22deg);
  animation:scan 3s infinite;
}

@keyframes scan{
  0%,25%{
    left:-100%;
  }
  65%,100%{
    left:160%;
  }
}

.enter span{
  position:relative;
  z-index:2;
}

.enter:hover{
  transform:translateY(-4px) scale(1.03);
  box-shadow:
    0 0 30px rgba(157,45,255,.85),
    0 0 80px rgba(121,0,255,.3);
}

.enter:active{
  transform:scale(.95);
}

/* FOOTER */

.footer{
  margin-top:25px;
  color:#554b5d;
  font-size:8px;
  letter-spacing:3px;
  text-transform:uppercase;
}

/* EXIT ANIMATION */

.screen.exit{
  opacity:0;
  transform:scale(1.12);
  pointer-events:none;
}

/* MOBILE */

@media(max-width:600px){

  .content{
    padding:18px;
  }

  .welcome{
    letter-spacing:5px;
  }

  .logo{
    letter-spacing:3px;
  }

  .tagline{
    font-size:8px;
    letter-spacing:2px;
  }

  .line{
    margin:24px auto;
  }

  .enter{
    height:57px;
  }
}
</style>

<body>

<div class="bg">

  <div class="grid"></div>

  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <div class="particles" id="particles"></div>

</div>

<main class="screen" id="screen">

  <div class="content">

    <div class="system">
      <span class="dot"></span>
      NEXVORA SYSTEM ONLINE
    </div>

    <div class="welcome">
      Welcome To
    </div>

    <div class="logo">
      NEXVORA<br>UNBAN<br>BYPASS
    </div>

    <div class="tagline">
      Next-Generation Account Bypass Appeal Platform
    </div>

    <div class="line"></div>

    <button class="enter" onclick="enterPlatform()">
      <span>ENTER PLATFORM</span>
    </button>

    <div class="footer">
      Secure • Fast • Independent
    </div>

  </div>

</main>

<script>

const particleBox =
  document.getElementById("particles");

const count =
  window.innerWidth < 600 ? 35 : 60;

for(let i=0;i<count;i++){

  const p=document.createElement("span");

  p.className="particle";

  p.style.left=
    Math.random()*100+"%";

  p.style.animationDuration=
    (5+Math.random()*9)+"s";

  p.style.animationDelay=
    (Math.random()*8)+"s";

  const size=
    (1+Math.random()*2)+"px";

  p.style.width=size;
  p.style.height=size;

  particleBox.appendChild(p);
}

function enterPlatform(){

  const screen=
    document.getElementById("screen");

  screen.classList.add("exit");

  setTimeout(()=>{

    window.location.href="license.html";

  },800);
}

</script>

</body>
